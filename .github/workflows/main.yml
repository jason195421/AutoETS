name: 编译 ETS Next Beta EXE

# 触发条件：推送到main分支 或 手动触发
on:
  push:
    branches: [ main ]
    paths:
      - 'sb.py'  # 仅当核心脚本修改时触发（可选）
  workflow_dispatch:  # 允许手动在GitHub界面触发

jobs:
  build-windows-exe:
    runs-on: windows-latest  # Windows环境（生成EXE必需）
    
    steps:
      # 1. 检出代码
      - name: 检出GitHub仓库代码
        uses: actions/checkout@v4

      # 2. 设置Python环境（匹配脚本兼容的Python版本，建议3.8-3.11）
      - name: 配置Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # 缓存依赖，加速构建

      # 3. 安装依赖（包括打包工具pyinstaller和项目依赖）
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pyinstaller  # 项目依赖+打包工具
          pip install pywin32  # Windows环境打包必需依赖（可选，解决部分兼容性问题）

      # 4. 用PyInstaller打包EXE（核心步骤）
      - name: 打包Python脚本为EXE
        run: |
          pyinstaller --onefile --name "ets next beta" --windowed   sb.py
       

      # 5. 用7z压缩EXE（减小体积，满足"压缩exe文件"需求）
      - name: 压缩EXE为7z包
        run: |
          # Windows自带7z工具，压缩dist目录下的EXE
          7z a -t7z "ets next beta.7z" ./dist/"ets next beta.exe"
        working-directory: ${{ github.workspace }}

      # 6. 上传压缩包到GitHub Artifact（供下载）
      - name: 上传压缩包产物
        uses: actions/upload-artifact@v4
        with:
          name: ets-next-beta-exe  # Artifact名称（下载时显示）
          path: ${{ github.workspace }}/"ets next beta.7z"  # 压缩包路径
          retention-days: 30  # 产物保留30天（可调整）
          if-no-files-found: error  # 若未生成文件则构建失败
