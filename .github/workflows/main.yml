name: ETS Next Beta 

on: [push]
 
jobs:
  build-windows-exe:
    runs-on: windows-latest  
    
    steps:
      # 1. 检出代码
      - name: 检出GitHub仓库代码
        uses: actions/checkout@v4

      # 2. 设置Python环境
      - name: 配置Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # 缓存依赖，加速构建

      # 3. 安装依赖（包括打包工具pyinstaller和项目依赖）
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pyinstaller  # 项目依赖+打包工具
          pip install pywin32  # Windows环境打包必需依赖（可选，解决部分兼容性问题）

      # 4. 用PyInstaller打包EXE（核心步骤）
      - name: 打包Python脚本为EXE
        run: |
          pyinstaller --onefile --name "ets next beta" --windowed   sb.py
       

     
      # 5. 上传压缩包到GitHub Artifact
      - name: 上传压缩包产物
        uses: actions/upload-artifact@v4
        with:
          name: ets-next-beta-exe  # Artifact名称（下载时显示）
          path: D:\a\ets-next\ets-next\dist  # 压缩包路径
          retention-days: 90
          if-no-files-found: error  # 若未生成文件则构建失败
