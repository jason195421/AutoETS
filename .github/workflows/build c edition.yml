name: 编译 ETS Next C 版本
on:
  push:
    branches: [ main, rewrite ]  # 触发分支（按需调整）
  pull_request:
    branches: [ main, rewrite ]  # PR 触发

jobs:
  build-windows-c:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSYS2 与 C 语言依赖
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-  
            mingw-w64-x86_64-gcc  
            mingw-w64-x86_64-cjson  
            mingw-w64-x86_64-libzip 
            mingw-w64-x86_64-pcre  
            mingw-w64-x86_64-make

      - name: 编译 C 代码（静态链接）
        shell: msys2 {0}
        run: |
          # 配置 MinGW 环境变量
          export PATH="/mingw64/bin:$PATH"
          # 编译命令（主文件为 main.c，按需修改文件名）
          gcc -std=c99 -o ets_next_c.exe main.c \
              -lshlwapi -lcjson -lzip -lpcre -static \
              -Wall -Wextra  # 开启警告（可选）
          # 验证编译产物
          if [ -f "ets_next_c.exe" ]; then
            echo "C 语言版本编译成功！"
          else
            echo "编译失败！"
            exit 1
          fi

      - name: 上传编译产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ets-next-windows-c
          path: |
            ets_next_c.exe  # C 语言编译的可执行文件
            template.docx  # 空白docx模板（需放在源码根目录）
          retention-days: 30  # 产物保留 30 天
