name: Build EXE

on:
  push:
    branches: [ main ]
  # 如果希望手动触发，可以添加下面这行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # 也可以使用 windows-latest 以获得原生体验

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # 指定你的Python版本

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller  # 确保安装PyInstaller[citation:6]

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile sb.py  # 将your_script_name.py替换为你的主脚本[citation:1][citation:6]

    - name: Upload EXE as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ets next
        path: dist/  # 上传dist目录下生成的EXE文件[citation:6]
